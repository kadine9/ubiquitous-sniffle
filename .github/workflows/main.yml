name: Transmission & Pixeldrain

on:
  push:
    branches: Transpix
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '0bfe0b11-611d-4bb3-9b4c-36dbaa5a1fd5'
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies & Transmission
        run: |
          sudo apt update
          sudo apt install jq curl python3 python3-requests p7zip-full transmission-cli -y

      - name: Download with Transmission (Concurrent & Live Progress)
        run: |
          mkdir -p "$FOLDER_PATH"
          
          python3 - << 'EOF'
          import requests, time, os, subprocess, threading, sys

          link_url = os.environ.get('LINK_FETCH_URL')
          kill_url = os.environ.get('KILL_SWITCH_URL')
          folder = os.environ.get('FOLDER_PATH')

          print("📥 Fetching links...")
          try:
              page = requests.get(link_url, timeout=10).text
          except Exception as e:
              print(f"❌ Failed to fetch links: {e}")
              sys.exit(1)

          links = [line.strip() for line in page.splitlines() if line.strip() and not line.startswith('#')]

          if not links:
              print("⚠️ No torrent links found in the fetch URL.")
              sys.exit(0)

          print(f"✅ Found {len(links)} link(s). Starting concurrent Transmission downloads...\n")

          processes = []
          kill_triggered = False

          def download_torrent(link):
              global kill_triggered
              cmd = ["transmission-cli", "-w", folder, "-m", link]
              print(f"🚀 Starting download: {link}")
              proc = subprocess.Popen(cmd)
              processes.append(proc)
              while proc.poll() is None:
                  if kill_triggered:
                      proc.terminate()
                      break
                  time.sleep(2)
              proc.wait()

          threads = []
          for link in links:
              t = threading.Thread(target=download_torrent, args=(link,))
              t.start()
              threads.append(t)

          while any(t.is_alive() for t in threads):
              if kill_url:
                  try:
                      ks = requests.get(kill_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n🛑 Global kill switch activated! Terminating all downloads...")
                          kill_triggered = True
                          for p in processes:
                              try:
                                  p.terminate()
                              except:
                                  pass
                          break
                  except:
                      pass
              time.sleep(5)

          for t in threads:
              t.join()

          print("\n🎉 Concurrent download phase complete.")
          EOF

      - name: Smart Zipping & Splitting
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess
          root_dir = "downloaded_files"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          sub_ext = ('.srt', '.ass', '.vtt', '.sub')
          media_ext = video_ext + sub_ext
          max_size_bytes = 7000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, dn, fn in os.walk(p) for f in fn)

          if os.path.exists(root_dir):
              for item in os.listdir(root_dir):
                  item_path = os.path.join(root_dir, item)
                  if os.path.isdir(item_path):
                      videos = [f for f in os.listdir(item_path) if f.lower().endswith(video_ext)]
                      if len(videos) > 3:
                          zip_name = f"{item}.zip"
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(root_dir)
                          if folder_size > max_size_bytes:
                              subprocess.run(["7z", "a", "-v7000m", "-mx0", zip_name, item], check=True)
                          else:
                              subprocess.run(["7z", "a", "-mx0", zip_name, item], check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)
                      else:
                          for r, _, files in os.walk(item_path):
                              for f in files:
                                  if f.lower().endswith(media_ext):
                                      dst = os.path.join(root_dir, f)
                                      if not os.path.exists(dst): shutil.move(os.path.join(r, f), dst)
                          shutil.rmtree(item_path, ignore_errors=True)
          EOF

      - name: Upload to Pixeldrain
        run: |
          python3 - << 'EOF'
          import os
          import requests

          api_key = os.environ.get("PIXELDRAIN_API_KEY")
          folder_path = os.environ.get("FOLDER_PATH", "downloaded_files")

          if not api_key:
              print("❌ Error: PIXELDRAIN_API_KEY is not set.")
              exit(1)

          if not os.path.exists(folder_path):
              print(f"❌ Error: Folder {folder_path} does not exist.")
              exit(1)

          for root, dirs, files in os.walk(folder_path):
              for filename in sorted(files):
                  if ".!qB" in filename or ".part" in filename:
                      continue
                  
                  file_path = os.path.join(root, filename)
                  print(f"📤 Uploading: {filename}...")

                  try:
                      with open(file_path, "rb") as f:
                          response = requests.post(
                              "https://pixeldrain.com/api/file",
                              auth=("", api_key),
                              files={"file": (filename, f)}
                          )
                      
                      res_json = response.json()
                      success = res_json.get("success", False)
                      file_id = res_json.get("id")

                      if success and file_id:
                          print(f"✅ Successfully uploaded: {filename} (ID: {file_id})")
                          print(f"🔗 Link: https://pixeldrain.com/u/{file_id}")
                          os.remove(file_path)
                          print(f"🗑️ Cleaned up local file: {filename}")
                      else:
                          print(f"❌ Failed to upload {filename}. Response: {response.text}")
                          exit(1)
                  except Exception as e:
                      print(f"❌ Exception during upload of {filename}: {e}")
                      exit(1)
          EOF

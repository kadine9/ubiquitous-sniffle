name: qBittorrent & Buzzheavier

on:
  push:
    branches: Pix
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      BUZZHEAVIER_API_KEY: 'FINS3KA5OL68CPW5MEYD'
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'
      KILL_SWITCH_URL: 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: sudo apt update && sudo apt install qbittorrent-nox jq curl zip p7zip-full python3 python3-requests -y

      - name: Download with qBittorrent & Boxed Progress
        run: |
          mkdir -p "$FOLDER_PATH"
          touch added_links.txt
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true
          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          Queueing\QueueEnabled=true
          Queueing\MaxActiveDownloads=10
          Queueing\MaxActiveTorrents=25
          EOF

          qbittorrent-nox -d
          sleep 5

          python3 - << 'EOF'
          import requests, time, os
          from datetime import datetime

          link_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'
          kill_url = 'https://fhpsbwpqtteuchtgyqlj.supabase.co/functions/v1/page-download/d5777cc7-e5c5-4bc8-9b31-60d96e7862d8'
          folder_path = 'downloaded_files'
          absolute_save_path = os.path.abspath(folder_path)
          added_links = set()
          update_count = 0

          def fmt_eta(sec):
              if sec is None or sec < 0 or sec >= 8640000: return "∞"
              m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")

              if kill_url:
                  try:
                      ks = requests.get(kill_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n" + "="*50 + f"\n🛑 [GH-qBittorrent-Buzzheavier] Global kill switch activated! | {timestamp}\n" + "="*50)
                          break
                      targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                      if targets:
                          res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                          for t in res:
                              if any(tg in t['name'].lower() for tg in targets if tg):
                                  requests.post('http://127.0.0.1:8080/api/v2/torrents/delete', data={'hashes': t['hash'], 'deleteFiles': 'true'})
                  except Exception: pass

              if link_url:
                  try:
                      page = requests.get(link_url, timeout=5).text
                      for link in page.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and link not in added_links:
                              requests.post('http://127.0.0.1:8080/api/v2/torrents/add', data={'urls': link, 'savepath': absolute_save_path})
                              added_links.add(link)
                  except Exception: pass

              try:
                  res = requests.get('http://127.0.0.1:8080/api/v2/torrents/info').json()
                  print(f"\n" + "="*50)
                  print(f"🔄 [GH-qBittorrent-Buzzheavier] Progress Update #{update_count} | {timestamp}")
                  print("-"*50)
                  if not res:
                      print("📥 Waiting for active torrents...")
                      all_done = False
                  else:
                      all_done = True
                      for t in res:
                          prog = int(t.get('progress', 0) * 100)
                          speed_mb = t.get('dlspeed', 0) / (1024 * 1024)
                          eta_str = fmt_eta(t.get('eta', -1))
                          print(f"📥 Torrent: {t['name']} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {eta_str}")
                          if prog < 100: all_done = False
                  print("="*50 + "\n")
                  if all_done and res: break
              except Exception: pass
              time.sleep(10)
          EOF

          pkill qbittorrent-nox || true
          sleep 2
          
      - name: Smart Zipping & Splitting (Recursive Nested Subfolders)
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess

          root_dir = "downloaded_files"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          sub_ext = ('.srt', '.ass', '.vtt', '.sub')
          media_ext = video_ext + sub_ext
          max_size_bytes = 7000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, dn, fn in os.walk(p) for f in fn)

          if os.path.exists(root_dir):
              # Walk bottom-up so nested subfolders are handled before parent folders
              for current_root, dirs, files in os.walk(root_dir, topdown=False):
                  if current_root == root_dir:
                      continue
                  
                  videos = [f for f in files if f.lower().endswith(video_ext)]
                  
                  # If folder has multiple videos or is a distinct structural folder we want to zip up
                  if len(videos) > 3:
                      folder_name = os.path.basename(current_root)
                      parent_dir = os.path.dirname(current_root)
                      zip_name = f"{folder_name}.zip"
                      folder_size = get_dir_size(current_root)
                      
                      orig = os.getcwd()
                      os.chdir(parent_dir)
                      if folder_size > max_size_bytes:
                          subprocess.run(["7z", "a", "-v7000m", "-mx0", zip_name, folder_name], check=True)
                      else:
                          subprocess.run(["7z", "a", "-mx0", zip_name, folder_name], check=True)
                      os.chdir(orig)
                      
                      shutil.rmtree(current_root)
                  else:
                      # Flatten loose media files up to the main root_dir or handle them cleanly
                      for f in files:
                          if f.lower().endswith(media_ext):
                              src = os.path.join(current_root, f)
                              dst = os.path.join(root_dir, f)
                              if not os.path.exists(dst):
                                  shutil.move(src, dst)
                      # Clean up empty subdirectories
                      if not os.listdir(current_root):
                          os.rmdir(current_root)
          EOF

      - name: Upload to Buzzheavier
        run: |
          python3 - << 'EOF'
          import os
          import requests

          api_key = os.environ.get("BUZZHEAVIER_API_KEY")
          folder_path = os.environ.get("FOLDER_PATH", "downloaded_files")

          if not api_key:
              print("❌ Error: BUZZHEAVIER_API_KEY is not set.")
              exit(1)

          if not os.path.exists(folder_path):
              print(f"❌ Error: Folder {folder_path} does not exist.")
              exit(1)

          for root, dirs, files in os.walk(folder_path):
              for filename in sorted(files):
                  if ".!qB" in filename or ".part" in filename:
                      continue
                  
                  file_path = os.path.join(root, filename)
                  print(f"📤 Uploading to Buzzheavier: {filename}...")

                  try:
                      with open(file_path, "rb") as f:
                          response = requests.post(
                              "https://buzzheavier.com/api/v1/file",
                              headers={"Authorization": f"Bearer {api_key}"},
                              files={"file": (filename, f)}
                          )
                      
                      # Check response validity based on standard API design
                      if response.status_code in [200, 201]:
                          print(f"✅ Successfully uploaded: {filename}")
                          os.remove(file_path)
                          print(f"🗑️ Cleaned up local file: {filename}")
                      else:
                          print(f"❌ Failed to upload {filename}. Status: {response.status_code} Response: {response.text}")
                          exit(1)
                  except Exception as e:
                      print(f"❌ Exception during upload of {filename}: {e}")
                      exit(1)
          EOF

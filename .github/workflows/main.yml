name: Transmission & FileMirage

on:
  push:
    branches: Trans
    
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_KEY: '9QQH-DGES-CWQZ-FXNV' # Optional: fill in if your account requires an API key, otherwise leave blank for anonymous guest upload
      FOLDER_PATH: 'downloaded_files'
      LINK_FETCH_URL: 'https://pink-script-snap.lovable.app/api/public/page/77b85f24-8683-48e7-8972-fb5539521b32.txt'
      KILL_SWITCH_URL: 'https://pink-script-snap.lovable.app/api/public/page/77b85f24-8683-48e7-8972-fb5539521b32.txt'

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies & Transmission
        run: |
          sudo apt update
          # Install expect, 7z, transmission-cli, and other necessary tools
          sudo apt install jq curl python3 python3-requests expect p7zip-full transmission-cli -y

      - name: Download with Transmission (Live Progress)
        run: |
          mkdir -p "$FOLDER_PATH"
          
          python3 - << 'EOF'
          import requests, time, os, subprocess, threading, sys

          link_url = os.environ.get('LINK_FETCH_URL')
          kill_url = os.environ.get('KILL_SWITCH_URL')
          folder = os.environ.get('FOLDER_PATH')

          print("📥 Fetching links...")
          try:
              page = requests.get(link_url, timeout=10).text
          except Exception as e:
              print(f"❌ Failed to fetch links: {e}")
              sys.exit(1)

          # Extract valid links
          links = [line.strip() for line in page.splitlines() if line.strip() and not line.startswith('#')]

          if not links:
              print("⚠️ No torrent links found in the fetch URL.")
              sys.exit(0)

          print(f"✅ Found {len(links)} link(s). Starting Transmission...\n")

          for link in links:
              print(f"📥 Downloading: {link}")
              # -w sets the download directory, -m exits immediately after completion without seeding
              cmd = ["transmission-cli", "-w", folder, "-m", link]
              
              process = subprocess.Popen(cmd)

              def check_kill_switch():
                  while process.poll() is None:
                      try:
                          ks = requests.get(kill_url, timeout=5).text
                          if "STOP.ALL.TORRENTS" in ks:
                              print("\n🛑 Global kill switch activated! Killing Transmission...")
                              process.terminate()
                              break
                      except:
                          pass
                      time.sleep(10)

              # Run the kill switch monitor in the background
              threading.Thread(target=check_kill_switch, daemon=True).start()

              # Wait for Transmission to finish downloading the current link
              process.wait()

          print("\n🎉 Download phase complete.")
          EOF

      - name: Smart Zipping & Splitting
        run: |
          python3 - << 'EOF'
          import os, shutil, subprocess
          root_dir = "downloaded_files"
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          sub_ext = ('.srt', '.ass', '.vtt', '.sub')
          media_ext = video_ext + sub_ext
          max_size_bytes = 7000 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, dn, fn in os.walk(p) for f in fn)

          if os.path.exists(root_dir):
              for item in os.listdir(root_dir):
                  item_path = os.path.join(root_dir, item)
                  if os.path.isdir(item_path):
                      videos = [f for f in os.listdir(item_path) if f.lower().endswith(video_ext)]
                      if len(videos) > 3:
                          zip_name = f"{item}.zip"
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(root_dir)
                          if folder_size > max_size_bytes:
                              subprocess.run(["7z", "a", "-v7000m", "-mx0", zip_name, item], check=True)
                          else:
                              subprocess.run(["7z", "a", "-mx0", zip_name, item], check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)
                      else:
                          for r, _, files in os.walk(item_path):
                              for f in files:
                                  if f.lower().endswith(media_ext):
                                      dst = os.path.join(root_dir, f)
                                      if not os.path.exists(dst): shutil.move(os.path.join(r, f), dst)
                          shutil.rmtree(item_path, ignore_errors=True)
          EOF

      - name: Upload to FileMirage
        run: |
          if [ ! -d "$FOLDER_PATH" ]; then
              echo "❌ Error: Folder $FOLDER_PATH does not exist."
              exit 1
          fi

          # Using -print0 and read -d '' ensures spaces and special characters are perfectly preserved
          find "$FOLDER_PATH" -type f -print0 | sort -z | while IFS= read -r -d '' FILE; do
              
              FILENAME=$(basename "$FILE")
              
              echo "📤 Uploading: $FILENAME to FileMirage..."
              
              # Build optional header array if API key is specified
              AUTH_HEADER=()
              if [ -n "${{ env.FILEMIRAGE_API_KEY }}" ]; then
                  AUTH_HEADER=(-H "x-api-key: ${{ env.FILEMIRAGE_API_KEY }}")
              fi
              
              # Upload via FileMirage standard multipart form upload API
              RESPONSE=$(curl -s -X POST "https://filemirage.com/api/upload" "${AUTH_HEADER[@]}" -F "file=@$FILE")
              
              # Parse response fields
              SHARE_URL=$(echo "$RESPONSE" | jq -r '.url // .link // empty')
              
              if [ -n "$SHARE_URL" ] && [ "$SHARE_URL" != "null" ]; then
                  echo "✅ Successfully uploaded: $FILENAME"
                  echo "🔗 Link: $SHARE_URL"
                  echo "---------------------------------------------------"
              else
                  echo "❌ Failed to upload $FILENAME"
                  echo "API Response: $RESPONSE"
                  exit 1
              fi
          done

name: Quick Buzzheavier Test Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      BUZZHEAVIER_API_KEY: 'FINS3KA5OL68CPW5MEYD'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Test File
        run: |
          mkdir -p test_folder
          echo "Hello Buzzheavier, this is a quick test file generated at $(date)" > test_folder/sample_test.txt

      - name: Upload Test File to Buzzheavier
        run: |
          python3 - << 'EOF'
          import os
          import requests

          api_key = os.environ.get("BUZZHEAVIER_API_KEY")
          file_path = "test_folder/sample_test.txt"
          filename = os.path.basename(file_path)

          if not api_key:
              print("❌ Error: BUZZHEAVIER_API_KEY is not set.")
              exit(1)

          if not os.path.exists(file_path):
              print(f"❌ Error: Test file {file_path} does not exist.")
              exit(1)

          # Buzzheavier uses a PUT request structure: https://w.buzzheavier.com/{filename}
          upload_url = f"https://w.buzzheavier.com/{filename}"
          headers = {
              "Authorization": f"Bearer {api_key}"
          }

          print(f"📤 Uploading {filename} to Buzzheavier...")

          try:
              with open(file_path, "rb") as f:
                  response = requests.put(upload_url, headers=headers, data=f)

              print(f"Status Code: {response.status_code}")
              print(f"Response Body: {response.text}")

              if response.status_code in [200, 201]:
                  print(f"✅ Successfully uploaded {filename}!")
              else:
                  print(f"❌ Failed to upload {filename}.")
                  exit(1)

          except Exception as e:
              print(f"❌ Exception during upload: {e}")
              exit(1)
          EOF
